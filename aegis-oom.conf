# aegis-oom configuration: declarative thresholds and policy.
# Parsed as KEY=value without executing shell code. Keep it declarative.
#
# A "#" outside quotes starts a comment, also after a value. systemd
# EnvironmentFile passes such comments on, and the daemons strip them the same
# way, so quote a value only if it contains "#".

# OOM killer (aegis-oom)
AEG_OOM_DRYRUN=1           # 1 = only log and write state, kill nothing; set 0 to act
AEG_OOM_PSI_SOFT=20        # memory "some" avg10 percent: warn level, does not kill by itself
AEG_OOM_PSI_HARD=40        # memory "full" avg10 percent: kill, but only together with low memory
# Free memory thresholds in percent of MemTotal. Explicit AEG_OOM_AVAIL_*_MB
# values, when set, override the percentages.
AEG_OOM_AVAIL_SOFT_PCT=4   # MemAvailable below this gives SOFT (clamped to 384 MiB..3 GiB)
AEG_OOM_AVAIL_HARD_PCT=1.5 # MemAvailable below this gives HARD at once (clamped to 128 MiB..1 GiB)
# AEG_OOM_AVAIL_SOFT_MB=1024
# AEG_OOM_AVAIL_HARD_MB=384
AEG_OOM_SUSTAIN_N=3        # consecutive samples pressure must hold before SOFT becomes HARD
AEG_OOM_BASELINE_K=2.0     # a PSI spike is baseline * K; under long load the threshold rises with the baseline
AEG_OOM_BASELINE_ALPHA=0.02 # baseline smoothing rate (0.02 gives a time constant of about 75 s at a 1.5 s cycle)
AEG_OOM_PROTECT_SMART=1    # 1 = discount victims by traits (GUI, age, system service)
AEG_OOM_CGROUP_KILL=0      # 1 = SIGKILL the whole leaf cgroup of the victim; a leaf with a
                           # protected member, a session or a slice always gets a single signal
AEG_OOM_RATE_MS=2000       # at most one kill per N ms
AEG_OOM_TERM_GRACE_MS=8000 # let SIGTERM finish before escalating or picking another victim
AEG_OOM_REFRESH_MS=1500    # hot cycle: pressure is near or a monitor is open
AEG_OOM_IDLE_MS=6000       # idle cycle: meminfo and PSI only, /proc is not scanned
AEG_OOM_IDLE_SCAN_S=60     # how often to refresh the candidate snapshot while idle
AEG_OOM_PSI_STALL_US=150000   # PSI trigger stall threshold (us)
AEG_OOM_PSI_WINDOW_US=1000000 # PSI trigger window (us)
AEG_OOM_STATE=/run/aegis/oom.state
# Comm names (as in /proc/PID/comm, at most 15 characters) that neither daemon
# ever touches, together with their descendants. Empty means: rely on the traits
# for aegis-oom and on the built-in list for aegis-reaper. A value here replaces
# the reaper's built-in list, so repeat the system names you want to keep.
# Examples:
# AEG_OOM_PROTECT=sshd,pipewire,wireplumber,Xorg,gnome-shell,firefox
# AEG_OOM_PROTECT=sshd,sway,foot,java
AEG_OOM_PROTECT=
# Both daemons reread this file on SIGHUP: systemctl reload aegis-oom aegis-reaper

# Fork bomb reaper (aegis-reaper)
AEG_REAPER_DRYRUN=0        # 1 = log the leaf it would kill, kill nothing
